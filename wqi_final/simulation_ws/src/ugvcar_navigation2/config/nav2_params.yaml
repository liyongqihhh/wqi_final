bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    # 20 Hz is sufficient for navigation and avoids a 100 Hz CPU load in the VM.
    bt_loop_duration: 50
    # Milliseconds. VirtualBox can miss Nav2 action acknowledgements at 20 ms.
    default_server_timeout: 5000
    # Rewritten by campus_navigation.launch.py to the installed package path.
    # This tree keeps the accepted global path until it becomes invalid instead
    # of replacing the controller path every second.
    default_nav_to_pose_bt_xml: ""
    # 'default_nav_through_poses_bt_xml' and 'default_nav_to_pose_bt_xml' are use defaults:
    # nav2_bt_navigator/navigate_to_pose_w_replanning_and_recovery.xml
    # nav2_bt_navigator/navigate_through_poses_w_replanning_and_recovery.xml
    # They can be set here or via a RewrittenYaml remap from a parent launch file to Nav2.
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
