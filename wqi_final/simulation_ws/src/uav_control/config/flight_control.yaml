/**:
  ros__parameters:
    use_sim_time: true

/uav/flight_controller:
  ros__parameters:
    command_rate: 20.0
    default_position_tolerance: 0.4
    default_velocity_tolerance: 0.1
    settle_duration: 1.0
    default_timeout: 180.0
    minimum_altitude: 0.15
    # Horizontal cruise remains at 15 m; this ceiling permits local facade
    # ascent to the highest selectable campus floor.
    maximum_altitude: 45.0
    odom_wait_timeout: 15.0
    safety_monitor_enabled: true
    safety_data_timeout: 1.5
    dynamic_replanning_enabled: true
    dynamic_replan_period: 0.5
    dynamic_path_clearance: 2.5
    dynamic_path_spacing: 0.5
    dynamic_path_lookahead: 1.5
    dynamic_obstacle_warning_distance: 6.0
    dynamic_rear_warning_distance: 4.0
    dynamic_target_clearance: 1.5
    obstacle_vector_timeout: 1.0
    # Require several clear observations before replacing an active detour.
    dynamic_clear_confirmations: 3
    # Keep the sjtu position-loop error bounded and shorten the final approach
    # so the vehicle cannot overshoot into the 1.8 m obstacle envelope.
    cruise_position_setpoint_step: 2.0
    approach_slowdown_distance: 4.0
    approach_position_setpoint_step: 0.6

/uav/flight_state_monitor:
  ros__parameters:
    path_publish_rate: 2.0
    path_min_distance: 0.1
    path_max_poses: 3000

/uav/safety_monitor:
  ros__parameters:
    safety_radius: 1.8
    safety_center_height: 0.18
    self_filter_radius: 0.58
    lidar_height: 0.45
    platform_protected_min_height: 1.2
    down_sensor_height: 0.09
    diagonal_sensor_height: 0.11
    diagonal_downward_angle: 0.78539816339
    diagonal_ground_tolerance: 0.08
    blind_spot_threshold: 1.8
    sensor_timeout: 1.0
    ground_return_tolerance: 0.18
    # Use a local surface patch instead of one noisy ray, then keep the same
    # obstacle association unless a replacement is confirmed repeatedly.
    obstacle_patch_depth: 0.35
    obstacle_patch_radius: 0.75
    obstacle_vector_alpha: 0.35
    obstacle_vector_association_distance: 0.9
    obstacle_vector_switch_confirmations: 3
    obstacle_vector_maximum_hold_updates: 3
    publish_rate: 10.0
